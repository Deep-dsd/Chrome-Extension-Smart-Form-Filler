<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Form Filler</title>
  <link rel="stylesheet" href="../../assets/styles/shared.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-content">
        <div class="logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M7 9h10M7 13h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="17" cy="15" r="2" fill="currentColor"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>Smart Form Filler</h1>
          <p class="subtitle">Auto-fill forms with test data</p>
        </div>
      </div>
    </header>

    <!-- Status Section -->
    <section class="status-section">
      <div id="lastAction" class="last-action">
        <span class="status-dot"></span>
        <span id="statusText">Ready to fill forms</span>
      </div>
    </section>

    <!-- Quick Settings -->
    <section class="quick-settings">
      <h2 class="section-title">Quick Settings</h2>
      
      <div class="toggle-wrapper">
        <span class="toggle-label">Fill Names</span>
        <label class="toggle">
          <input type="checkbox" id="toggleNames" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="toggle-wrapper">
        <span class="toggle-label">Fill Contact Info</span>
        <label class="toggle">
          <input type="checkbox" id="toggleContact" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>

      <div class="toggle-wrapper">
        <span class="toggle-label">Fill Address</span>
        <label class="toggle">
          <input type="checkbox" id="toggleAddress" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </section>

    <div class="divider"></div>

    <!-- Instructions -->
    <section class="instructions">
      <h2 class="section-title">How to Use</h2>
      <ol class="instruction-list">
        <li>Right-click on any form field</li>
        <li>Select "Fill Form with Test Data"</li>
        <li>Form will auto-fill with realistic data</li>
      </ol>
    </section>

    <!-- Footer -->
    <footer class="popup-footer">
      <a href="#" id="openOptions" class="footer-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        All Settings
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
